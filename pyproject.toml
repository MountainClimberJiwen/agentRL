[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrl"
version = "0.1.0"
description = "Extract agent session data (Codex/Kimi/Hermes/cc-connect) for RL training"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "jiwen"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.scripts]
agentrl-extract = "scripts.extract:main"
agentrl-ingest = "scripts.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
